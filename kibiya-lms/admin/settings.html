<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../assets/kibiya_logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings - Kibiya LMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Tabs styling */
        .tabs-header {
            display: flex;
            gap: 1rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
            padding-bottom: 0.25rem;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }
        .settings-tab-content {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container" style="max-width: 100%; padding: 0 2rem;">
            <div class="logo">
                <img src="../assets/kibiya_logo.png" alt="Kibiya Hub" style="height:42px; width:42px; object-fit:contain; border-radius:50%;">
                Kibiya<span>Hub</span>
            </div>
            <div class="nav-profile flex items-center"></div>
        </div>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">
                    <i>📊</i> Dashboard
                </a>
                <a href="facilitators.html" class="sidebar-link">
                    <i>👩‍🏫</i> Facilitators
                </a>
                <a href="students.html" class="sidebar-link">
                    <i>🎓</i> Students
                </a>
                <a href="courses.html" class="sidebar-link">
                    <i>📚</i> Courses
                </a>
                <a href="pages.html" class="sidebar-link">
                    <i>📄</i> Pages (CMS)
                </a>
                <a href="settings.html" class="sidebar-link active">
                    <i>⚙️</i> Settings
                </a>
            </nav>
        </aside>

        <main class="dashboard-content">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2>Settings</h2>
                    <p>Configure Kibiya LMS settings and manage your account.</p>
                </div>
            </div>

            <!-- Tabs Switcher -->
            <div class="tabs-header">
                <button class="tab-btn active" id="tab-system-btn" onclick="switchTab('system')">⚙️ System Settings</button>
                <button class="tab-btn" id="tab-profile-btn" onclick="switchTab('profile')">👤 Profile Settings</button>
            </div>

            <!-- Tab Content: System Settings -->
            <div id="section-system" class="settings-tab-content grid grid-cols-2 gap-4">
                <div class="card">
                    <div class="flex justify-between items-center mb-3">
                        <h3 style="margin: 0;">General Settings</h3>
                        <button class="btn btn-primary" onclick="alert('Settings saved!')">Save Changes</button>
                    </div>
                    <form class="mt-3">
                        <div class="form-group">
                            <label class="form-label">Platform Name</label>
                            <input type="text" class="form-control" value="Kibiya Technology and Innovation Hub LMS">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Support Email</label>
                            <input type="email" class="form-control" value="support@kibiya.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Default Theme</label>
                            <select class="form-control" style="appearance: none; background: rgba(15, 23, 42, 0.8);">
                                <option>Dark Theme</option>
                                <option>Light Theme</option>
                            </select>
                        </div>
                    </form>
                </div>

                <div class="card">
                    <h3>Security</h3>
                    <form class="mt-3">
                        <div class="form-group">
                            <label class="form-label">Require Strong Passwords</label>
                            <input type="checkbox" checked style="accent-color: var(--accent-primary);"> Yes
                        </div>
                        <div class="form-group mt-3">
                            <label class="form-label">Session Timeout (minutes)</label>
                            <input type="number" class="form-control" value="120">
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tab Content: Profile Settings -->
            <div id="section-profile" class="settings-tab-content grid grid-cols-2 gap-4" style="display: none;">
                <div class="card">
                    <h3>👤 Profile Information</h3>
                    <div class="mt-3">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="settings-name" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="settings-email" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Profile Picture</label>
                            <input type="file" id="settings-image" class="form-control" accept="image/*">
                        </div>
                        <button class="btn btn-primary mt-3" onclick="saveProfile()">💾 Save Profile</button>
                    </div>
                </div>

                <div class="card">
                    <h3>🔒 Change Password</h3>
                    <div class="mt-3">
                        <div class="form-group">
                            <label class="form-label">Current Password</label>
                            <input type="password" id="settings-current-pw" class="form-control" placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" id="settings-new-pw" class="form-control" placeholder="••••••••">
                        </div>
                        <button class="btn btn-secondary mt-3" onclick="changePassword()">🔑 Update Password</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/main.js"></script>
    <script>
        checkAuth('admin');

        function switchTab(tabName) {
            document.querySelectorAll('.settings-tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tabName === 'system') {
                document.getElementById('section-system').style.display = 'grid';
                document.getElementById('tab-system-btn').classList.add('active');
            } else if (tabName === 'profile') {
                document.getElementById('section-profile').style.display = 'grid';
                document.getElementById('tab-profile-btn').classList.add('active');
            }
        }

        const CURRENT_USER = getCurrentUser();

        function renderSettings() {
            if (CURRENT_USER) {
                document.getElementById('settings-name').value = CURRENT_USER.name || '';
                document.getElementById('settings-email').value = CURRENT_USER.email || '';
            }
        }

        function saveProfile() {
            const newName = document.getElementById('settings-name').value.trim();
            const newEmail = document.getElementById('settings-email').value.trim();
            if (!newName || !newEmail) { alert('Name and email cannot be empty.'); return; }

            const dbUser = MOCK_DB.users.find(u => u.id === CURRENT_USER.id);
            if (!dbUser) return;

            const imageFile = document.getElementById('settings-image').files[0];
            const saveChanges = () => {
                dbUser.name = newName;
                dbUser.email = newEmail;
                saveDB();
                localStorage.setItem('kibiya_user', JSON.stringify(dbUser));
                alert('✅ Profile updated successfully!');
                window.location.reload();
            };

            if (imageFile) {
                readImageAsDataUrl(imageFile).then(imageData => {
                    dbUser.image = imageData;
                    saveChanges();
                });
            } else {
                saveChanges();
            }
        }

        function changePassword() {
            const current = document.getElementById('settings-current-pw').value;
            const newPw = document.getElementById('settings-new-pw').value;
            const dbUser = MOCK_DB.users.find(u => u.id === CURRENT_USER.id);

            if (!dbUser || dbUser.password !== current) {
                alert('❌ Current password is incorrect.'); return;
            }
            if (newPw.length < 6) {
                alert('❌ New password must be at least 6 characters.'); return;
            }
            dbUser.password = newPw;
            saveDB();
            document.getElementById('settings-current-pw').value = '';
            document.getElementById('settings-new-pw').value = '';
            alert('✅ Password changed successfully!');
        }

        // Initialize Settings on load
        document.addEventListener('DOMContentLoaded', () => {
            renderSettings();
        });
    </script>
</body>
</html>
