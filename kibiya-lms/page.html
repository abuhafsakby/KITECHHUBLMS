<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/kibiya_logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibiya Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-content-wrapper {
            background: var(--bg-secondary);
            border-radius: var(--border-radius-lg);
            padding: 3rem;
            margin: 3rem auto;
            border: 1px solid var(--border-color);
            min-height: 50vh;
        }

        .page-content-wrapper h1, .page-content-wrapper h2 {
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }
        
        .page-content-wrapper p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        /* 2-Column Layout */
        .page-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 3rem;
            margin: 3rem auto;
        }

        .page-sidebar {
            padding-top: 3rem;
        }

        .page-sidebar h3 {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .sidebar-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-links li {
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .sidebar-links a {
            color: var(--accent-primary);
            font-size: 0.95rem;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .sidebar-links a:hover {
            color: var(--accent-hover);
        }

        .social-icons {
            display: flex;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-primary);
            color: white;
            text-decoration: none;
            transition: var(--transition);
        }

        .social-icons a:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .page-content-wrapper {
            background: var(--bg-secondary);
            border-radius: var(--border-radius-lg);
            padding: 3rem;
            border: 1px solid var(--border-color);
            min-height: 50vh;
        }



        .team-grid, .course-grid {
            display: grid;
            gap: 1.25rem;
            margin-top: 2rem;
        }

        .team-grid {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .course-grid {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .member-card, .course-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1.25rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container flex justify-between items-center" style="max-width: 1200px; width: 100%;">
            <a href="index.html" class="logo">
                <img src="assets/kibiya_logo.png" alt="Kibiya Hub" style="height:42px; width:42px; object-fit:contain; border-radius:50%;">
                Kibiya<span>Hub</span>
            </a>
            
            <!-- Dynamic Navigation Links -->
            <div class="nav-links" id="dynamic-nav-links">
                <!-- Populated by JS -->
            </div>

            <!-- Profile / Login button -->
            <div class="nav-profile flex items-center" id="auth-section" style="gap: 0.75rem;">
                <!-- Default: not logged in -->
                <a href="login.html" class="btn btn-outline" style="padding: 0.4rem 1.2rem;">Login</a>
                <a href="login.html" class="btn btn-primary" style="padding: 0.4rem 1.2rem;">Get Started</a>
            </div>
        </div>
    </nav>

    <main class="container" style="max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">
        <div class="page-content-wrapper" id="page-container">
            <div style="text-align: center; color: var(--text-secondary); margin-top: 2rem;">Loading...</div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Render Dynamic Nav Links
            const navLinksContainer = document.getElementById('dynamic-nav-links');
            const visiblePages = MOCK_DB.pages.filter(p => p.published);
            let linksHtml = '';
            const standaloneNavPages = { 'about-us': 'about-us.html', 'our-courses': 'our-courses.html', 'contact-us': 'contact-us.html' };
            visiblePages.forEach(p => {
                // Avoid cluttering if there are many pages, just show a few core ones
                if (['about-us', 'our-courses', 'contact-us'].includes(p.id)) {
                    const href = standaloneNavPages[p.id] || `page.html?id=${p.id}`;
                    linksHtml += `<a href="${href}">${p.title}</a>`;
                }
            });
            
            // Add a dropdown or "More" link for others
            const otherPages = visiblePages.filter(p => !['about-us', 'our-courses', 'contact-us'].includes(p.id) && p.id !== 'home');
            if (otherPages.length > 0) {
                linksHtml += `
                    <div style="position: relative; display: inline-block; cursor: pointer;" class="nav-dropdown">
                        <span style="color: var(--text-primary); font-weight: 500; font-size: 0.95rem;">Explore ▾</span>
                        <div class="dropdown-content" style="display: none; position: absolute; top: 100%; left: 0; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 0.5rem 0; min-width: 150px; z-index: 50; box-shadow: var(--shadow-md);">
                            ${otherPages.map(p => `<a href="page.html?id=${p.id}" style="display: block; padding: 0.5rem 1rem; color: var(--text-secondary);">${p.title}</a>`).join('')}
                        </div>
                    </div>
                `;
            }
            navLinksContainer.innerHTML = linksHtml;

            // Simple hover for dropdown
            const dropdown = document.querySelector('.nav-dropdown');
            if (dropdown) {
                dropdown.addEventListener('mouseenter', () => dropdown.querySelector('.dropdown-content').style.display = 'block');
                dropdown.addEventListener('mouseleave', () => dropdown.querySelector('.dropdown-content').style.display = 'none');
            }

            // Auth Section Handling
            const user = getCurrentUser();
            const authSection = document.getElementById('auth-section');
            if (user) {
                authSection.innerHTML = `
                    <div style="text-align: right; margin-right: 1rem;">
                        <div style="font-weight: 600; font-size: 0.9rem;">${user.name}</div>
                        <div style="font-size: 0.75rem; color: var(--accent-primary);">${user.role.toUpperCase()}</div>
                    </div>
                    <a href="${user.role}/dashboard.html" class="btn btn-outline" style="padding: 0.4rem 1rem; font-size: 0.8rem; margin-right: 0.5rem;">Dashboard</a>
                    <button id="dynamic-logout-page" class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.8rem;">Logout</button>
                `;
                document.getElementById('dynamic-logout-page').addEventListener('click', logout);
            }

            // Load Page Content
            const urlParams = new URLSearchParams(window.location.search);
            const pageId = urlParams.get('id') || 'home';

            // Redirect to standalone pages if they exist
            const standaloneRedirects = {
                'contact-us': 'contact-us.html',
                'about-us': 'about-us.html',
                'our-courses': 'our-courses.html'
            };
            if (standaloneRedirects[pageId]) {
                window.location.replace(standaloneRedirects[pageId]);
                return;
            }
            
            const page = MOCK_DB.pages.find(p => p.id === pageId);
            const container = document.getElementById('page-container');

            if (page && page.published) {
                document.title = `${page.title} - Kibiya Hub`;
                let contentHtml = `
                    <h1 style="text-align: center; font-size: 2.5rem; margin-bottom: 1rem;">${page.title}</h1>
                    ${page.content}
                `;

                if (page.id === 'our-courses') {
                    const courses = (MOCK_DB.courses || []).filter(course => course && course.title);
                    const enrollments = user ? (MOCK_DB.enrollments || []).filter(e => e.studentId === user.id) : [];
                    contentHtml += `
                        <div class="course-grid">
                            ${courses.map(course => {
                                const isEnrolled = enrollments.some(e => e.courseId === course.id);
                                let buttonHtml = '';
                                
                                if (user && user.role === 'student') {
                                    if (isEnrolled) {
                                        buttonHtml = `<a href="student/course.html?id=${course.id}" class="btn btn-success" style="width: 100%; justify-content: center;">▶ Continue Course</a>`;
                                    } else {
                                        buttonHtml = `<button onclick="enrollDirectly(${course.id}, '${course.title.replace(/'/g, "\\'")}')" class="btn btn-primary" style="width: 100%; justify-content: center;">🚀 Quick Enroll</button>`;
                                    }
                                } else {
                                    buttonHtml = `<a href="register.html?courseId=${course.id}" class="btn btn-primary" style="width: 100%; justify-content: center;">Enroll Now</a>`;
                                }

                                return `
                                    <article class="course-card">
                                        <div class="badge badge-primary" style="margin-bottom: 0.75rem;">${course.code || 'COURSE'}</div>
                                        <h3 style="margin-bottom: 0.5rem;">${course.title}</h3>
                                        <p style="color: var(--text-secondary); margin-bottom: 1rem;">${course.description || 'A practical course designed to build real-world skills.'}</p>
                                        ${buttonHtml}
                                    </article>
                                `;
                            }).join('')}
                        </div>
                    `;
                }

                if (page.id === 'our-management') {
                    const officers = [...(MOCK_DB.managementTeam || [])].sort((a, b) => (parseInt(a.rank) || 999) - (parseInt(b.rank) || 999));
                    const council = [...(MOCK_DB.advisoryCouncil || [])].sort((a, b) => (parseInt(a.rank) || 999) - (parseInt(b.rank) || 999));

                    const renderTeamSection = (title, list, defaultBio, separateLeader = true) => {
                        if (!list || list.length === 0) return '';
                        
                        let html = `<h2 style="margin-top: 2.5rem; text-align: center;">${title}</h2>`;
                        
                        if (separateLeader) {
                            const leader = list[0];
                            const remaining = list.slice(1);
                            
                            // Leader row (centered, 1 card)
                            html += `
                                <div style="display: flex; justify-content: center; margin-top: 1.5rem; margin-bottom: 2rem;">
                                    <div class="member-card" style="text-align: center; max-width: 340px; width: 100%;">
                                        <img src="${leader.image || 'assets/management.png'}" alt="${leader.name}" style="width: 160px; height: 160px; object-fit: cover; border-radius: 50%; border: 3px solid var(--accent-primary); margin: 0 auto 1.25rem; display: block;">
                                        <h3 style="margin-bottom: 0.25rem;">${leader.name}</h3>
                                        <p style="color: var(--accent-primary); font-weight: 600; margin-bottom: 0.75rem;">${leader.title}</p>
                                        <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6;">${leader.bio || defaultBio}</p>
                                    </div>
                                </div>
                            `;
                            
                            // Remaining members (3-column grid layout)
                            if (remaining.length > 0) {
                                html += `
                                    <div class="team-grid-three" style="display: grid; gap: 1.5rem; margin-top: 1.5rem;">
                                        ${remaining.map(member => `
                                            <div class="member-card" style="text-align: center;">
                                                <img src="${member.image || 'assets/management.png'}" alt="${member.name}" style="width: 140px; height: 140px; object-fit: cover; border-radius: 50%; border: 3px solid var(--accent-primary); margin: 0 auto 1.25rem; display: block;">
                                                <h3 style="margin-bottom: 0.25rem;">${member.name}</h3>
                                                <p style="color: var(--accent-primary); font-weight: 600; margin-bottom: 0.75rem;">${member.title}</p>
                                                <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6;">${member.bio || defaultBio}</p>
                                            </div>
                                        `).join('')}
                                    </div>
                                `;
                            }
                        } else {
                            // Render all in a 3-column grid
                            html += `
                                <div class="team-grid-three" style="display: grid; gap: 1.5rem; margin-top: 1.5rem;">
                                    ${list.map(member => `
                                        <div class="member-card" style="text-align: center;">
                                            <img src="${member.image || 'assets/management.png'}" alt="${member.name}" style="width: 140px; height: 140px; object-fit: cover; border-radius: 50%; border: 3px solid var(--accent-primary); margin: 0 auto 1.25rem; display: block;">
                                            <h3 style="margin-bottom: 0.25rem;">${member.name}</h3>
                                            <p style="color: var(--accent-primary); font-weight: 600; margin-bottom: 0.75rem;">${member.title}</p>
                                            <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6;">${member.bio || defaultBio}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            `;
                        }
                        return html;
                    };

                    contentHtml += `
                        <style>
                            .team-grid-three {
                                grid-template-columns: 1fr;
                            }
                            @media (min-width: 576px) {
                                .team-grid-three { grid-template-columns: repeat(2, 1fr); }
                            }
                            @media (min-width: 992px) {
                                .team-grid-three { grid-template-columns: repeat(3, 1fr); }
                            }
                        </style>
                        ${renderTeamSection("Management Team", officers, "Dedicated to leading Kibiya Hub with excellence.", true)}
                        ${renderTeamSection("Advisory Council", council, "Supporting the institution with strategic guidance.", false)}
                    `;
                }

                if (page.id === 'our-partners') {
                    const partners = [...(MOCK_DB.partners || [])].sort((a, b) => (parseInt(a.rank) || 999) - (parseInt(b.rank) || 999));
                    contentHtml += `
                        <div class="partner-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
                            ${partners.map(p => `
                                <div class="partner-card" style="background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 1.5rem; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
                                    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                                        <img src="${p.image || 'assets/logo_watermark.png'}" alt="${p.name}" style="max-width: 180px; max-height: 80px; object-fit: contain; margin-bottom: 1.25rem; border-radius: 4px;">
                                        <h3 style="margin-bottom: 0.5rem; font-size: 1.2rem;">${p.name}</h3>
                                        <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1rem;">${p.description || 'Global educational partner.'}</p>
                                    </div>
                                    ${p.link ? `<a href="${p.link}" target="_blank" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.3rem 0.8rem; width: fit-content; margin-top: auto;">Visit Website ↗</a>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                if (page.id === 'galleries') {
                    const galleries = MOCK_DB.galleries || [];
                    contentHtml += `
                        <div class="gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
                            ${galleries.map(g => `
                                <article class="gallery-card" style="border-radius: 1rem; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,0.08);">
                                    <img src="${g.src}" alt="${(g.caption || '').replace(/"/g, '')}" style="display: block; width: 100%; height: 220px; object-fit: cover;">
                                    <p style="padding: 1rem; background: var(--bg-secondary); color: var(--text-secondary); margin: 0;">${g.caption || ''}</p>
                                </article>
                            `).join('')}
                        </div>
                    `;
                }

                container.innerHTML = contentHtml;
            } else {
                document.title = 'Page Not Found - Kibiya Hub';
                container.innerHTML = `
                    <div style="text-align: center; padding: 4rem 0;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">404</div>
                        <h2>Page Not Found</h2>
                        <p style="color: var(--text-secondary);">The page you are looking for does not exist or has been unpublished.</p>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 1rem;">Return Home</a>
                    </div>
                `;
            }
        });
    </script>

    <footer class="site-footer">
        <div class="container footer-top">
            <div class="footer-contact-grid">
                <div class="footer-contact-item">
                    <div class="footer-icon">✉️</div>
                    <p>hello@example.com</p>
                </div>
                <div class="footer-contact-item">
                    <div class="footer-icon">📞</div>
                    <p>+1 (555) 123-4567</p>
                </div>
                <div class="footer-contact-item">
                    <div class="footer-icon">📍</div>
                    <p>123 Learning Way,<br>City, Country</p>
                </div>
            </div>
        </div>
        <div class="container footer-links">
            <div>
                <h4>Quick Links</h4>
                <a href="page.html?id=our-courses">Our Courses</a>
                <a href="page.html?id=contact-us">Contact Us</a>
                <a href="page.html?id=galleries">Gallery</a>
                <a href="page.html?id=about-us">Who We Are</a>
                <a href="page.html?id=our-partners">Partners</a>
            </div>
            <div>
                <h4>More</h4>
                <a href="page.html?id=our-management">Management</a>
                <a href="page.html?id=our-courses">Course Catalog</a>
                <a href="page.html?id=contact-us">Support</a>
            </div>
        </div>
        <div class="container footer-bottom">
            © 2026 Kibiya Hub. All rights reserved.
        </div>
    </footer>
</body>
</html>
