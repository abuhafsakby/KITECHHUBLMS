<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../assets/kibiya_logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Player - Kibiya LMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .player-layout {
            display: flex;
            min-height: calc(100vh - 73px);
        }

        /* ── Sidebar module list ── */
        .module-list {
            width: 300px;
            background: var(--bg-tertiary);
            border-right: 1px solid var(--border-color);
            padding: 1rem 0;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .module-list-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 0.5rem 1.5rem 0.75rem;
        }
        .module-item {
            padding: 0.85rem 1.5rem;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }
        .module-item:hover { background: rgba(16,185,129,0.04); border-left-color: rgba(16,185,129,0.4); }
        .module-item.active { background: rgba(16,185,129,0.08); border-left-color: var(--accent-primary); }
        .module-item .item-no { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.15rem; }
        .module-item .item-title { font-weight: 500; font-size: 0.9rem; }
        .module-item .item-status { font-size: 0.75rem; color: var(--accent-primary); margin-top: 0.2rem; }

        /* Locked module styling */
        .module-item.locked {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }
        .module-item.locked:hover {
            background: transparent;
            border-left-color: transparent;
        }
        .module-item .item-status.completed { color: var(--accent-primary); }
        .module-item .item-status.locked-status { color: var(--text-muted); }

        /* ── Content area ── */
        .content-area {
            flex-grow: 1;
            padding: 2.5rem 3rem;
            overflow-y: auto;
            max-width: 900px;
        }

        /* ── Media player ── */
        .media-wrapper {
            width: 100%;
            background: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }
        .media-wrapper video {
            width: 100%;
            max-height: 460px;
            display: block;
            background: #000;
        }
        .media-wrapper img {
            width: 100%;
            max-height: 460px;
            object-fit: contain;
            display: block;
        }
        .media-wrapper iframe {
            width: 100%;
            height: 500px;
            border: none;
            display: block;
        }
        .media-wrapper audio {
            width: 100%;
            padding: 1rem;
        }

        /* File download card (for non-playable files) */
        .file-download-card {
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: var(--border-radius);
            padding: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .file-download-card .file-icon { font-size: 3rem; flex-shrink: 0; }
        .file-download-card .file-name { font-weight: 600; word-break: break-all; }
        .file-download-card .file-meta { font-size: 0.85rem; color: var(--text-secondary); }

        /* No-media placeholder */
        .no-media-placeholder {
            width: 100%;
            padding: 2.5rem;
            background: rgba(0,0,0,0.3);
            border-radius: var(--border-radius);
            text-align: center;
            margin-bottom: 2rem;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
        }
        .no-media-placeholder .icon { font-size: 3rem; margin-bottom: 0.5rem; }

        /* Progress nav */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Exam bar */
        .exam-bar {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(245,158,11,0.08);
            border: 1px solid rgba(245,158,11,0.25);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container" style="max-width: 100%; padding: 0 2rem;">
            <div class="logo">
                <a href="dashboard.html" style="display:flex;align-items:center;gap:0.5rem;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-primary);">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <img src="../assets/kibiya_logo.png" alt="Kibiya Hub" style="height:42px; width:42px; object-fit:contain; border-radius:50%;">
                Kibiya<span>Hub</span>
                </a>
            </div>
            <div class="nav-profile flex items-center"></div>
        </div>
    </nav>

    <div class="player-layout">

        <!-- Sidebar -->
        <aside class="module-list" id="module-list">
            <!-- Populated by JS -->
        </aside>

        <!-- Main content -->
        <main class="content-area">
            <div class="badge badge-primary mb-2" id="course-name-badge">Course</div>
            <h1 id="module-title" style="margin-bottom:0.5rem;">Select a Module</h1>
            <p id="module-subtitle" style="font-size:0.9rem;"></p>

            <!-- Media area -->
            <div id="media-area"></div>

            <!-- Reading material -->
            <div class="card" id="content-card" style="display:none;">
                <h3>📄 Reading Material</h3>
                <p id="module-text" class="mt-2" style="white-space: pre-wrap; line-height:1.9;"></p>
            </div>

            <!-- Quiz + navigation -->
            <div id="module-footer" style="display:none;">
                <div class="nav-bar">
                    <button class="btn btn-secondary" id="prev-btn" onclick="navigateModule(-1)">← Previous</button>
                    <a href="#" class="btn btn-primary" id="take-quiz-btn" style="display:none;">📝 Take Module Quiz</a>
                    <button class="btn btn-secondary" id="review-quiz-btn" style="display:none;">👁️ Review Passed Quiz</button>
                    <button class="btn btn-secondary" id="next-btn" onclick="navigateModule(1)">Next →</button>
                </div>

                <!-- Final exam CTA -->
                <div class="exam-bar" id="exam-bar" style="display:none;">
                    <div>
                        <strong>🎓 Ready for the Final Exam?</strong>
                        <p style="margin:0;font-size:0.9rem;color:var(--text-secondary);">Complete all modules then sit the final exam to earn your certificate.</p>
                    </div>
                    <a href="#" id="final-exam-btn" class="btn btn-primary" style="border-color:var(--accent-warning);background:var(--accent-warning);color:#000;white-space:nowrap;">
                        Take Final Exam
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/main.js"></script>
    <script>
        checkAuth('student');

        let COURSE = null;
        let ALL_MODULES = [];
        let CURRENT_INDEX = 0;
        let ENROLLMENT = null;

        // Helper: check if a module at a given index is unlocked
        function isModuleUnlocked(index) {
            if (index === 0) return true; // First module always unlocked
            if (!ENROLLMENT || !ENROLLMENT.completedModules) return index === 0;
            // All previous modules must be completed
            for (let i = 0; i < index; i++) {
                const prevMod = ALL_MODULES[i];
                if (!ENROLLMENT.completedModules.includes(prevMod.id)) {
                    return false;
                }
            }
            return true;
        }

        // Helper: check if a specific module is completed
        function isModuleCompleted(modId) {
            return ENROLLMENT && ENROLLMENT.completedModules && ENROLLMENT.completedModules.includes(modId);
        }

        // Helper: check if all modules are completed
        function allModulesCompleted() {
            if (!ENROLLMENT || !ENROLLMENT.completedModules) return false;
            return ALL_MODULES.every(m => ENROLLMENT.completedModules.includes(m.id));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = parseInt(urlParams.get('id'));
            const returnModuleId = urlParams.get('moduleId') ? parseInt(urlParams.get('moduleId')) : null;
            COURSE = MOCK_DB.courses.find(c => c.id === courseId);

            if (!COURSE) {
                document.body.innerHTML = '<div style="padding:4rem;text-align:center;"><h2>Course Not Found</h2><a href="dashboard.html" class="btn btn-primary" style="margin-top:1rem;">← Back</a></div>';
                return;
            }

            // Get or initialize enrollment
            const user = getCurrentUser();
            ENROLLMENT = MOCK_DB.enrollments.find(e => e.studentId === user.id && e.courseId === COURSE.id);
            if (ENROLLMENT && !ENROLLMENT.completedModules) {
                ENROLLMENT.completedModules = [];
                saveDB();
            }

            document.getElementById('course-name-badge').textContent = COURSE.title;
            document.getElementById('final-exam-btn').href = `quiz.html?courseId=${COURSE.id}&type=final`;
            ALL_MODULES = COURSE.modules || [];
            buildSidebar();

            if (ALL_MODULES.length > 0) {
                // If returning from a quiz, jump to that module's index
                let startIndex = 0;
                if (returnModuleId) {
                    const idx = ALL_MODULES.findIndex(m => m.id === returnModuleId);
                    if (idx >= 0 && isModuleUnlocked(idx)) {
                        startIndex = idx;
                    }
                }
                loadModule(startIndex);
            }
        });

        // ── Build sidebar ─────────────────────────────────────────────────
        function buildSidebar() {
            const sidebar = document.getElementById('module-list');
            sidebar.innerHTML = `<div class="module-list-title">${COURSE.title}</div>`;

            ALL_MODULES.forEach((mod, index) => {
                const unlocked = isModuleUnlocked(index);
                const completed = isModuleCompleted(mod.id);
                const item = document.createElement('div');
                item.className = 'module-item' + (index === 0 ? ' active' : '') + (!unlocked ? ' locked' : '');
                item.id = `sidebar-item-${index}`;

                let statusHtml = '';
                if (completed) {
                    statusHtml = `<div class="item-status completed">✅ Completed</div>`;
                } else if (!unlocked) {
                    statusHtml = `<div class="item-status locked-status">🔒 Locked</div>`;
                } else if (mod.fileName) {
                    statusHtml = `<div class="item-status">📎 File attached</div>`;
                }

                item.innerHTML = `
                    <div class="item-no">Module ${index + 1}</div>
                    <div class="item-title">${mod.title}</div>
                    ${statusHtml}
                `;
                if (unlocked) {
                    item.addEventListener('click', () => loadModule(index));
                }
                sidebar.appendChild(item);
            });

            // Final exam in sidebar
            const examItem = document.createElement('div');
            const examUnlocked = allModulesCompleted();
            examItem.className = 'module-item' + (!examUnlocked ? ' locked' : '');
            examItem.style.borderLeftColor = 'var(--accent-warning)';
            examItem.innerHTML = `
                <div class="item-no" style="color:var(--accent-warning);">Final Evaluation</div>
                <div class="item-title">${examUnlocked ? '📝 Take Final Exam' : '🔒 Complete All Modules First'}</div>
            `;
            if (examUnlocked) {
                examItem.addEventListener('click', () => {
                    window.location.href = `quiz.html?courseId=${COURSE.id}&type=final`;
                });
            }
            sidebar.appendChild(examItem);
        }

        // ── Load a module ─────────────────────────────────────────────────
        function loadModule(index) {
            // Gate: prevent loading locked modules
            if (!isModuleUnlocked(index)) {
                return;
            }

            CURRENT_INDEX = index;
            const mod = ALL_MODULES[index];
            if (!mod) return;

            const hasQuiz = mod.quiz && mod.quiz.questions && mod.quiz.questions.length > 0;
            const completed = isModuleCompleted(mod.id);

            // Auto-complete modules that have no quiz (just reading material)
            if (!hasQuiz && !completed && ENROLLMENT) {
                if (!ENROLLMENT.completedModules) ENROLLMENT.completedModules = [];
                ENROLLMENT.completedModules.push(mod.id);
                // Update progress
                const totalMods = ALL_MODULES.length;
                const completedCount = ENROLLMENT.completedModules.length;
                ENROLLMENT.progress = Math.min(90, Math.round((completedCount / totalMods) * 90));
                saveDB();
                buildSidebar(); // Refresh sidebar to reflect the new unlock status
            }

            // Sidebar highlight
            document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
            const sideItem = document.getElementById(`sidebar-item-${index}`);
            if (sideItem) sideItem.classList.add('active');

            // Titles
            document.getElementById('module-title').textContent = mod.title;
            document.getElementById('module-subtitle').textContent = `Module ${index + 1} of ${ALL_MODULES.length}`;
            document.getElementById('module-footer').style.display = 'block';

            // Render media
            renderMedia(mod);

            // Reading content
            const contentCard = document.getElementById('content-card');
            if (mod.content && mod.content.trim()) {
                contentCard.style.display = 'block';
                document.getElementById('module-text').textContent = mod.content;
            } else {
                contentCard.style.display = 'none';
            }

            // Quiz button
            const quizBtn = document.getElementById('take-quiz-btn');
            const reviewQuizBtn = document.getElementById('review-quiz-btn');
            quizBtn.onclick = null;
            reviewQuizBtn.onclick = null;
            reviewQuizBtn.style.display = 'none';
            reviewQuizBtn.style.opacity = '1';

            if (hasQuiz && !completed) {
                quizBtn.style.display = 'inline-flex';
                const quizHref = `quiz.html?courseId=${COURSE.id}&moduleId=${mod.id}`;
                quizBtn.href = quizHref;
                quizBtn.textContent = '📝 Take Module Quiz';
                quizBtn.style.pointerEvents = 'auto';
                quizBtn.style.opacity = '1';
                quizBtn.onclick = (e) => {
                    e.preventDefault();
                    window.location.href = quizHref;
                };
            } else if (hasQuiz && completed) {
                quizBtn.style.display = 'inline-flex';
                quizBtn.href = '#';
                quizBtn.textContent = '✅ Quiz Passed';
                quizBtn.style.pointerEvents = 'none';
                quizBtn.style.opacity = '0.6';
                reviewQuizBtn.style.display = 'inline-flex';
                reviewQuizBtn.onclick = () => openStudentQuizReview(mod);
            } else {
                quizBtn.style.display = 'none';
                quizBtn.removeAttribute('href');
                quizBtn.style.pointerEvents = 'none';
            }

            // Prev button: go to dashboard on first module, else go to previous module
            const prevBtn = document.getElementById('prev-btn');
            if (index === 0) {
                prevBtn.textContent = '🏠 Back to Dashboard';
                prevBtn.onclick = () => { window.location.href = 'dashboard.html'; };
                prevBtn.disabled = false;
            } else {
                prevBtn.textContent = '← Previous';
                prevBtn.onclick = () => navigateModule(-1);
                prevBtn.disabled = false;
            }

            // Next button: gated by quiz completion
            const nextBtn = document.getElementById('next-btn');
            const isLastModule = (index === ALL_MODULES.length - 1);
            const moduleIsCompleted = isModuleCompleted(mod.id);

            if (isLastModule) {
                if (moduleIsCompleted) {
                    nextBtn.textContent = '✅ Finish Course';
                    nextBtn.onclick = () => { window.location.href = 'dashboard.html'; };
                    nextBtn.disabled = false;
                    nextBtn.style.opacity = '1';
                } else {
                    nextBtn.textContent = '🔒 Pass Quiz to Finish';
                    nextBtn.onclick = null;
                    nextBtn.disabled = true;
                    nextBtn.style.opacity = '0.5';
                }
            } else {
                if (moduleIsCompleted) {
                    nextBtn.textContent = 'Next →';
                    nextBtn.onclick = () => navigateModule(1);
                    nextBtn.disabled = false;
                    nextBtn.style.opacity = '1';
                } else {
                    nextBtn.textContent = hasQuiz ? '🔒 Pass Quiz to Unlock Next' : 'Next →';
                    nextBtn.onclick = hasQuiz ? null : () => navigateModule(1);
                    nextBtn.disabled = hasQuiz;
                    nextBtn.style.opacity = hasQuiz ? '0.5' : '1';
                }
            }

            // Show final exam bar on last module
            const examBar = document.getElementById('exam-bar');
            examBar.style.display = isLastModule ? 'flex' : 'none';

            // Gate the final exam button
            const finalExamBtn = document.getElementById('final-exam-btn');
            if (allModulesCompleted()) {
                finalExamBtn.style.pointerEvents = 'auto';
                finalExamBtn.style.opacity = '1';
                finalExamBtn.textContent = 'Take Final Exam';
            } else {
                finalExamBtn.style.pointerEvents = 'none';
                finalExamBtn.style.opacity = '0.5';
                finalExamBtn.textContent = '🔒 Complete All Modules';
            }
        }

        function navigateModule(direction) {
            const newIndex = CURRENT_INDEX + direction;
            if (newIndex >= 0 && newIndex < ALL_MODULES.length && isModuleUnlocked(newIndex)) {
                loadModule(newIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // ── Smart media renderer ──────────────────────────────────────────
        async function renderMedia(mod) {
            const area = document.getElementById('media-area');
            area.innerHTML = '';

            if (!mod.fileName) {
                // No file uploaded — show placeholder
                area.innerHTML = `
                    <div class="no-media-placeholder">
                        <div class="icon">📖</div>
                        <p>No media uploaded for this module. Read the material below.</p>
                    </div>
                `;
                return;
            }

            const fileName = mod.fileName;
            const ext = fileName.split('.').pop().toLowerCase();

            // Try to load from IndexedDB
            let fileBlob = null;
            try {
                fileBlob = await getModuleFile(COURSE.id, mod.id);
            } catch (err) {
                console.error('Failed to get file from IndexedDB:', err);
            }

            let blobUrl = '';
            if (fileBlob) {
                blobUrl = URL.createObjectURL(fileBlob);
            } else {
                // Fallback to legacy localStorage key if present
                const blobKey = 'kibiya_file_' + mod.id;
                const legacyData = mod.fileData || localStorage.getItem(blobKey);
                if (legacyData) {
                    blobUrl = legacyData;
                }
            }

            const videoExts = ['mp4', 'webm', 'ogg', 'mov', 'mkv', 'avi'];
            const audioExts = ['mp3', 'wav', 'aac', 'flac', 'ogg', 'm4a'];
            const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'];
            const pdfExts   = ['pdf'];

            let mediaHtml = '';

            if (videoExts.includes(ext)) {
                if (blobUrl) {
                    mediaHtml = `
                        <div class="media-wrapper" id="video-wrapper">
                            <video controls autoplay id="module-video" src="${blobUrl}" style="width:100%;max-height:460px;background:#000;">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    `;
                    area.innerHTML = mediaHtml;
                } else {
                    // No stored blob — show upload prompt
                    area.innerHTML = `
                        <div class="media-wrapper" id="video-wrapper">
                            <div style="padding:2.5rem;text-align:center;background:#000;">
                                <div style="font-size:3rem;margin-bottom:0.75rem;">🎬</div>
                                <p style="color:#ccc;margin-bottom:0.25rem;font-weight:600;">${fileName}</p>
                                <p style="color:#999;font-size:0.85rem;margin-bottom:1.25rem;">
                                    To play this video, select it from your computer below.
                                </p>
                                <input type="file" id="local-file-input" accept="video/*,audio/*" style="display:none;">
                                <button class="btn btn-primary" onclick="document.getElementById('local-file-input').click()">
                                    📂 Browse & Load File
                                </button>
                                <p style="color:#666;font-size:0.75rem;margin-top:1rem;">
                                    File: <em>${fileName}</em>
                                </p>
                            </div>
                        </div>
                    `;
                    // After user selects file, save it to IndexedDB and reload
                    area.querySelector('#local-file-input').addEventListener('change', async function () {
                        if (this.files.length === 0) return;
                        const file = this.files[0];
                        try {
                            await saveModuleFile(COURSE.id, mod.id, file);
                            renderMedia(mod);
                        } catch (err) {
                            console.error('Failed to save file to IndexedDB:', err);
                        }
                    });
                }

            } else if (audioExts.includes(ext)) {
                if (blobUrl) {
                    mediaHtml = `
                        <div class="media-wrapper">
                            <audio controls id="module-audio" src="${blobUrl}" style="width:100%;padding:1rem;">
                                Your browser does not support the audio tag.
                            </audio>
                        </div>
                    `;
                    area.innerHTML = mediaHtml;
                } else {
                    area.innerHTML = buildFileCard(fileName, '🔊', 'Audio File');
                }

            } else if (imageExts.includes(ext)) {
                if (blobUrl) {
                    mediaHtml = `
                        <div class="media-wrapper">
                            <img src="${blobUrl}" id="module-img" alt="${fileName}" style="width:100%;max-height:460px;object-fit:contain;">
                        </div>
                    `;
                    area.innerHTML = mediaHtml;
                } else {
                    area.innerHTML = buildFileCard(fileName, '🖼️', 'Image File');
                }

            } else if (pdfExts.includes(ext)) {
                if (blobUrl) {
                    area.innerHTML = `
                        <div class="file-download-card">
                            <div class="file-icon">📄</div>
                            <div>
                                <div class="file-name">${fileName}</div>
                                <div class="file-meta">PDF Document — View below or open in a new tab</div>
                            </div>
                        </div>
                        <div class="media-wrapper">
                            <iframe src="${blobUrl}" id="pdf-frame" title="PDF viewer" style="height:550px;width:100%;border:none;"></iframe>
                        </div>
                    `;
                } else {
                    area.innerHTML = buildFileCard(fileName, '📄', 'PDF Document');
                }

            } else {
                // Generic downloadable file
                if (blobUrl) {
                    area.innerHTML = `
                        <div class="file-download-card">
                            <div class="file-icon">📁</div>
                            <div>
                                <div class="file-name">${fileName}</div>
                                <div class="file-meta">Study Material</div>
                                <a href="${blobUrl}" download="${fileName}" class="btn btn-primary" style="margin-top:0.75rem;">⬇️ Download File</a>
                            </div>
                        </div>
                    `;
                } else {
                    area.innerHTML = buildFileCard(fileName, '📁', 'Study Material');
                }
            }
        }

        function buildFileCard(fileName, icon, label) {
            return `
                <div class="file-download-card">
                    <div class="file-icon">${icon}</div>
                    <div style="flex:1;">
                        <div class="file-name">${fileName}</div>
                        <div class="file-meta">${label} — uploaded by facilitator</div>
                        <p style="font-size:0.82rem;color:var(--text-muted);margin-top:0.5rem;">
                            This file was uploaded by your facilitator. To view it, you may need to select it from your local drive if you have it saved.
                        </p>
                        <label class="btn btn-outline" style="margin-top:0.75rem;cursor:pointer;display:inline-flex;align-items:center;gap:0.5rem;">
                            📂 Load File from Computer
                            <input type="file" style="display:none;" onchange="handleGenericFile(this, '${fileName}')">
                        </label>
                    </div>
                </div>
            `;
        }

        async function handleGenericFile(input, expectedName) {
            if (!input.files.length) return;
            const file = input.files[0];
            const mod = ALL_MODULES[CURRENT_INDEX];
            if (mod) {
                try {
                    await saveModuleFile(COURSE.id, mod.id, file);
                    renderMedia(mod);
                } catch (err) {
                    console.error('Failed to save manual file to IndexedDB:', err);
                }
            }
        }

        function openStudentQuizReview(mod) {
            if (!mod || !mod.quiz || !mod.quiz.questions || mod.quiz.questions.length === 0) return;

            const title = `📋 Review: ${mod.title} Quiz`;
            const questionsHtml = mod.quiz.questions.map((q, index) => {
                return `
                    <div class="question-block">
                        <div class="flex justify-between items-center mb-2">
                            <label class="form-label" style="margin:0;">Question ${index + 1}</label>
                        </div>
                        <div class="form-group">
                            <div class="form-control" style="background: var(--bg-secondary); border:none; min-height:3rem;">${q.q}</div>
                        </div>
                        <div class="options-list">
                            ${q.options.map((opt, oIndex) => `
                                <div class="option-row" style="align-items:flex-start; gap:0.75rem;">
                                    <span style="width:20px; display:inline-flex; justify-content:center;">${oIndex === q.answer ? '✅' : '▫️'}</span>
                                    <span style="flex:1;">${opt}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            const existing = document.getElementById('dynamic-modal');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay active';
            overlay.id = 'dynamic-modal';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>${title}</h3>
                        <button class="modal-close" onclick="document.getElementById('dynamic-modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        ${questionsHtml}
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="document.getElementById('dynamic-modal').remove()">Close</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
