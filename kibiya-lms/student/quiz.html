<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../assets/kibiya_logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz/Exam - Kibiya LMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .quiz-container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 2rem;
        }

        .question-card {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
        }

        .question-title {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .option-label {
            display: block;
            padding: 1rem;
            margin-bottom: 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .option-label:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--accent-primary);
        }

        input[type="radio"] {
            margin-right: 1rem;
            accent-color: var(--accent-primary);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container" style="max-width: 100%; padding: 0 2rem;">
            <div class="logo">
                <img src="../assets/kibiya_logo.png" alt="Kibiya Hub" style="height:42px; width:42px; object-fit:contain; border-radius:50%;">
                Kibiya<span>Hub</span>
            </div>
            <div class="nav-profile flex items-center"></div>
        </div>
    </nav>

    <div class="quiz-container">
        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <h2 id="quiz-title">Loading...</h2>
                <span class="badge badge-warning" id="quiz-timer">Time Limit: 30:00</span>
            </div>
            
            <form id="quiz-form">
                <div id="questions-container">
                    <!-- Populated by JS -->
                </div>
                
                <div class="flex justify-between mt-4">
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit Answers</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        checkAuth('student');

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = parseInt(urlParams.get('courseId'));
            const moduleId = parseInt(urlParams.get('moduleId'));
            const type = urlParams.get('type'); // 'final' or null
            
            const course = MOCK_DB.courses.find(c => c.id === courseId);
            if (!course) return;

            let questions = [];
            let isFinal = type === 'final';

            if (isFinal) {
                document.getElementById('quiz-title').textContent = `${course.title} - Final Exam`;
                questions = course.finalExam.questions;
            } else {
                const mod = course.modules.find(m => m.id === moduleId);
                if (mod && mod.quiz) {
                    document.getElementById('quiz-title').textContent = `Module ${moduleId} Quiz`;
                    questions = mod.quiz.questions;
                }
            }

            const qContainer = document.getElementById('questions-container');
            questions.forEach((q, idx) => {
                const qBlock = document.createElement('div');
                qBlock.className = 'question-card';
                
                let optionsHtml = q.options.map((opt, oIdx) => `
                    <label class="option-label">
                        <input type="radio" name="q${idx}" value="${oIdx}" required>
                        ${opt}
                    </label>
                `).join('');

                qBlock.innerHTML = `
                    <div class="question-title">${idx + 1}. ${q.q}</div>
                    ${optionsHtml}
                `;
                qContainer.appendChild(qBlock);
            });

            document.getElementById('quiz-form').addEventListener('submit', (e) => {
                e.preventDefault();
                // Simple mock grading logic
                let score = 0;
                questions.forEach((q, idx) => {
                    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                    if (selected && parseInt(selected.value) === q.answer) {
                        score++;
                    }
                });

                const percentage = Math.round((score / questions.length) * 100);

                if (isFinal && percentage >= 50) {
                    // Final exam passed — update enrollment
                    const user = getCurrentUser();
                    const enrollment = MOCK_DB.enrollments.find(en => en.studentId === user.id && en.courseId === courseId);
                    if(enrollment) {
                        enrollment.completed = true;
                        enrollment.score = percentage;
                        enrollment.progress = 100;
                    }
                    saveDB();
                    alert(`🎉 Congratulations! You scored ${percentage}% and passed the final exam!`);
                    window.location.href = `certificate.html?courseId=${courseId}`;
                } else if (isFinal) {
                    alert(`You scored ${percentage}%. You need at least 50% to pass the final exam. Please review the course and try again.`);
                    window.location.href = `course.html?id=${courseId}`;
                } else {
                    // Module quiz
                    if (percentage >= 50) {
                        // Module quiz passed
                        const user = getCurrentUser();
                        const enrollment = MOCK_DB.enrollments.find(en => en.studentId === user.id && en.courseId === courseId);
                        if (enrollment) {
                            if (!enrollment.completedModules) enrollment.completedModules = [];
                            if (!enrollment.completedModules.includes(moduleId)) {
                                enrollment.completedModules.push(moduleId);
                            }
                            // Update progress (max 90% until final exam)
                            const totalMods = course.modules ? course.modules.length : 1;
                            const completedCount = enrollment.completedModules.length;
                            enrollment.progress = Math.min(90, Math.round((completedCount / totalMods) * 90));
                            saveDB();
                        }
                        alert(`✅ You scored ${percentage}% and passed the module quiz! The next module is now unlocked.`);
                        window.location.href = `course.html?id=${courseId}&moduleId=${moduleId}`;
                    } else {
                        alert(`You scored ${percentage}%. You need at least 50% to pass. Please review the module and try again.`);
                        window.location.href = `course.html?id=${courseId}&moduleId=${moduleId}`;
                    }
                }
            });
        });
    </script>
</body>
</html>
